spring:
  application:
    name: taskboard
  datasource:
    url: jdbc:h2:mem:taskboard      # 메모리에 뜨는 H2
    username: sa
    password:
  jpa:
    open-in-view: false             # 요청 내내 출석부를 열어 두지 않는다
    hibernate:
      ddl-auto: create-drop          # 시작 시 테이블 생성, 종료 시 삭제
    show-sql: true                    # 실행되는 SQL을 콘솔에 찍어준다
